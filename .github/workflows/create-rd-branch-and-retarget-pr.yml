name: Retarget PR to 3d_solver branch

on:
  push:
    branches:
      - copilot/refactor-differential-operators

jobs:
  retarget-to-3d-solver:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retarget PR to 3d_solver branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head copilot/refactor-differential-operators \
            --json number,baseRefName \
            --jq '.[] | select(.baseRefName != "3d_solver") | .number')
          if [ -z "$PR_NUMBER" ]; then
            echo "PR is already targeting '3d_solver' or no open PR found — nothing to do."
          else
            echo "Updating PR #$PR_NUMBER base to '3d_solver'..."
            gh pr edit "$PR_NUMBER" --base 3d_solver
            echo "Done. PR #$PR_NUMBER now targets '3d_solver'."
          fi
