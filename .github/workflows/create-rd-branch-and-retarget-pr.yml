name: Create rd branch and retarget PR

on:
  workflow_dispatch:

jobs:
  create-rd-and-retarget:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create rd branch from main (if not exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin rd; then
            echo "Branch 'rd' already exists, skipping creation."
          else
            echo "Creating 'rd' branch from main..."
            git fetch origin main
            git checkout -b rd origin/main
            git push origin rd
            echo "Branch 'rd' created successfully."
          fi

      - name: Retarget PR to rd branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list --head copilot/refactor-differential-operators \
            --json number,baseRefName \
            --jq '.[] | select(.baseRefName != "rd") | .number')
          if [ -z "$PR_NUMBER" ]; then
            echo "PR is already targeting 'rd' or no open PR found — nothing to do."
          else
            echo "Updating PR #$PR_NUMBER base to 'rd'..."
            gh pr edit "$PR_NUMBER" --base rd
            echo "Done. PR #$PR_NUMBER now targets 'rd'."
          fi
