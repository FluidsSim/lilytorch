
solver:
  use_gpu           : True
  nthreads          : 16

  # Grid parameters
  N                 : 512      # 1024
  xmin              : -0.0040  # -0.004
  xmax              : +0.0472  # 1.0
  ymin              : -0.0256  # -0.052
  ymax              : +0.0256  # +0.052

  # Physical parameters
  nu                : 1.0e-6
  rho               : 1.0e+3

  # Solver parameters
  convection_method : "abdquickest" # "implicit" "abdquickest"
  dt                : 0.0001
  nt                :  80000
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 2
  poisson_nsmoothing: 5
  poisson_verbose   : False

body:
  type: fish_analytical
  update_maps:
    rotation: "None"
    translation:
      - "lambda t: -t"
      - None
  control:
    L: 0.018
    A: 0.018
    f : 3.5
    wavefrequency: 0.95
    c1: +0.05
    c2: -0.13
    c3: +0.28
    sb: 0.07
    st: 0.95
    wh: 0.07
    wt: 0.01
    xshift: 0.0
    yshift: 0.0
    thk: false


output:
  save_path: "/data/pazzagli/simulation_results/fluid_solver/"
  save_frames: True
  save_every : 50
  vmin: -30
  vmax: 30
  save_uv: False

boundary_conditions:
  # DO NOT TOUCH (fluid inlet from the left)
  BC_type_u:
  - "D"
  - "-"
  - "N"
  - "N"

  # MODIFY PROGRAMMATICALLY FLUID SPEED
  BC_values_u:
  - 0.0
  - 0
  - 0
  - 0

  BC_type_v:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0



