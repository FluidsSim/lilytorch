
solver:
  use_gpu           : True
  nthreads          : 16
  Nx                : 512
  Ny                : 512
  xmin              : -0.1
  xmax              : 1.2
  ymin              : -0.65
  ymax              : 0.65
  dt                : 0.01
  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3
  convection_method : "implicit"
  poisson_tol            : 1.0e-2
  poisson_max_mgcg_cycles: 3
  poisson_max_cycles     : 1
  jacobi_weight          : 0.7
  poisson_nsmoothing     : 15
  poisson_verbose        : False
  poisson_folder         : "lilytorch/data/"

body:
  type: fish_analytical
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  control:
    L: 0.65
    A: 0.1
    f : 1
    wavefrequency: 2.5
    c1: 0.
    c2: 0.323
    c3: 0.4
    xshift: 0.0
    yshift: 0.0
    sb: 0.03
    st: 0.8
    wt: 0.02
    wh: 0.03
    thk: False


output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 10
  vmin: -60
  vmax: 60
  save_uv: False

boundary_conditions:
  BC_type_u:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_u:
  - 0.21
  - 0
  - 0
  - 0
  BC_type_v:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0



