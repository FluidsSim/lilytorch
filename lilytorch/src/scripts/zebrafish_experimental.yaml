
solver:
  use_gpu           : False
  nthreads          : 16

  # Grid parameters
  N                 : 512      # 1024
  xmin              : -0.0040  # -0.004
  xmax              : +0.0472  # 1.0
  ymin              : -0.0256  # -0.052
  ymax              : +0.0256  # +0.052

  # Physical parameters
  nu                : 1.0e-6
  rho               : 1.0e+3

  # Solver parameters
  convection_method : "abdquickest" # "implicit" "abdquickest"
  dt                : 0.0001
  nt                :  80000
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 2
  poisson_nsmoothing: 5
  poisson_verbose   : False

body:
  type: fish_experimental
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  control:
    body_length     : 0.018
    folder_name     : "lilytorch/scripts/zebrafish_files/data"
    file_name       : "kinematics_recording.csv"
    save_data       : False
    plot_data       : False
    target_fish     : 'Fish3'
    start_recording : 12100
    end_recording   : 12260
    timestep        : 0.001
    total_duration  : 30
    freq_scaling    : 0.25
    filter_freqs    : [1.0, 10.0]
    xshift          : 0.0
    yshift          : 0.0


output:
  save_path: "/data/pazzagli/simulation_results/fluid_solver/"
  save_frames: True
  save_every : 30
  vmin: -30
  vmax: 30
  save_uv: False

boundary_conditions:
  # DO NOT TOUCH (fluid inlet from the left)
  BC_type_u:
  - "D"
  - "-"
  - "N"
  - "N"

  # MODIFY PROGRAMMATICALLY FLUID SPEED
  BC_values_u:
  - 0.0
  - 0
  - 0
  - 0
  BC_type_v:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0



