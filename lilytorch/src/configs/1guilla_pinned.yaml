
solver :
  use_gpu           : True
  nthreads          : 16

  ## small tank
  Nx                : 256
  Ny                : 256
  xmin              : -1.5
  xmax              : 0.5
  ymin              : -1
  ymax              : 1.


  # ## medium tank
  # N                 : 512
  # xmin              : -1.0
  # xmax              : 5
  # ymin              : -3
  # ymax              : 3

  # ## large tank
  # N                 : 1024
  # xmin              : -1.0
  # xmax              : 11
  # ymin              : -6
  # ymax              : 6



  convection_method : "implicit"
  dt                : 0.001

  # convection_method : "abdquickest"
  # dt                : 0.001

  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3

  poisson_tol            : 1.0e-4
  poisson_max_mgcg_cycles: 3
  poisson_max_cycles     : 10
  jacobi_weight          : 0.8
  poisson_nsmoothing: 3
  poisson_verbose   : False
  poisson_folder : "data/"


boundary_conditions:
  BC_type_u:
  - "-"
  - "D"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - -0.5
  - 0
  - 0
  BC_type_v:
  - "-"
  - "D"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_mesh
  sdf_name: "1guilla.sdf"
  sdf_folder: "/data/andreaferrario/lilytorch/lilytorch/1guillasim/models/1guilla_v1/sdf/"
  plotting: False
  compute_interp: False
  plotting_meshes: False
  n_samples: (1000, 1000)
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  suit: 0.0
  convexify: True
  scale: 1

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 10
  vmin: -60
  vmax: 60
  save_uv: False
