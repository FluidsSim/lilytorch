units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 150001
  buffer_size: 150001
  play: true
  rtl: 1.0
  fast: false
  headless: true
  show_progress: true
physics:
  timestep: 0.0001
  gravity:
  - 0
  - 0
  - -9.81
  num_sub_steps: 1
  cb_sub_steps: 2
  n_solver_iters: 50
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicitfast
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 1000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 100.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.farms_examples.single_sphere_drop.controller.BDIMhandler
    bdim_yaml:
      solver :
        use_gpu : True
        nthreads : 16

        Nx: 256
        Ny: 2048
        # Nx: 1024
        # Ny: 8192
        xmin: -0.02
        ymin: 0.0
        xmax: 0.02
        ymax: 0.32

        convection_method : "adam-bashforth"
        dt                : 0.0001
        nt                : 150000
        nu                : 1.0e-6
        rho               : 1000.0
        # nu                : 0.006410256 # 0.000000801 # 1/Re Re=
        # rho               : 1.0


        poisson_tol       : 1.0e-7
        poisson_max_cycles: 5
        poisson_max_mgcg_cycles: 3
        jacobi_weight     : 0.7
        poisson_nsmoothing: 5
        poisson_verbose   : True
        poisson_folder : "data/"


      boundary_conditions:
        BC_type_u:
        - "N"
        - "N"
        - "N"
        - "N"
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - "N"
        - "N"
        - "N"
        - "N"
        BC_values_v:
        - 0
        - 0
        - 0
        - 0

      body:
        type: multi_animat
        plotting: True
        compute_interp: False
        plotting_meshes: True
        n_samples: (2000, 2000)
        update_maps:
          rotation: "None"
          translation:
            - None
            - None
        suit: 0.0
        convexify: True
        scale: 1

      output:
        save_path: "/data/andreaferrario/ns_data/"
        save_frames: True
        save_every : 500
        vmin: -5
        vmax: 5
        save_uv: True

# - loader: farms_mujoco.simulation.extensions.MjcfSaver
#   config:
#     path: output/simulation_mjcf.xml

# extensions: []

- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: output
    skip: 0

