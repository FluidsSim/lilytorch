units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 26001
  buffer_size: 26001
  play: true
  rtl: 1.0
  fast: false
  headless: true
  show_progress: true
physics:
  timestep: 2.5e-05
  gravity:
  - 0
  - 0
  - -980
  num_sub_steps: 1
  cb_sub_steps: 1
  n_solver_iters: 5000
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicitfast
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 10000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 100.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.integration.BDIMhandler.BDIMhandler
    bdim_yaml:
      solver:
        use_gpu: true
        nthreads: 16
        dtype: float64
        Nx: 512
        Ny: 1536
        xmin: 0
        ymin: 0
        xmax: 2
        ymax: 6
        convection_method: quick
        dt: 2.5e-05
        nt: 26001
        nu: 0.01
        rho: 1
        rho_body: 1.5
        eps_multiplier: 2
        poisson_tol: 1.0e-07
        poisson_max_cycles: 10
        poisson_max_mgcg_cycles: 5
        jacobi_weight: 0.7
        poisson_nsmoothing: 5
        poisson_verbose: true
        poisson_folder: data/
        poisson_smoother: jacobi
        poisson_method: fft
        poisson_bc_type: neumann
        heun: true
        force_delta_order: 1
      boundary_conditions:
        BC_type_u:
        - D
        - D
        - D
        - D
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - D
        - D
        - D
        - D
        BC_values_v:
        - 0
        - 0
        - 0
        - 0
      physics:
        solref:
        - 1.0e-05
        - 10
      body:
        2d_plane: xz
        force_scaling: 1.0
        type: multi_animat
        plotting: false
        compute_interp: false
        plotting_meshes: false
        save_folder: None
        n_samples:
        - 2000
        - 2000
        update_maps:
          rotation: None
          translation:
          - None
          - None
        suit: 0.0
        convexify: true
        scale: 1
      output:
        save_path: ''
        existing_folder: /data/andreaferrario/ns_data/coquerelle_heun_euler_study/heun_dt_0p000025
        save_frames: true
        save_every: 1000
        vmin: -50
        vmax: 50
        save_uv: true
- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: /data/andreaferrario/ns_data/coquerelle_heun_euler_study/heun_dt_0p000025/output
    skip: 0
