units:
  length: meter
  mass: kilogram
  time: second
runtime:
  n_iterations: 150001
  buffer_size: 150001
  play: true
  rtl: 1.0
  fast: false
  headless: true
  show_progress: true
physics:
  timestep: 0.001
  gravity:
  - 0
  - 0
  - -9.81
  num_sub_steps: 1
  cb_sub_steps: 2
  n_solver_iters: 1000
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicitfast
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1.0e-06
  noslip_iterations: 1000
  noslip_tolerance: 1.0e-06
  viewer: MuJoCo
  texture_repeat: 1
  shadow_size: 1024
  visual_scale: 100.0
  extent: 10.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: output
    skip: 0
- loader: farms_mujoco.simulation.extensions.MjcfSaver
  config:
    path: output/simulation_mjcf.xml
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.farms_examples.salamander.BDIMhandler.BDIMhandler
    bdim_yaml:
      solver:
        use_gpu: true
        nthreads: 16
        Nx: 4096
        Ny: 1024
        xmin: -0.12
        xmax: 0.68
        ymin: -0.1
        ymax: 0.1
        convection_method: implicit
        dt: 0.001
        nt: 800000
        nu: 1.0e-06
        rho: 1000.0
        poisson_tol: 1.0e-07
        poisson_max_cycles: 5
        poisson_max_mgcg_cycles: 3
        jacobi_weight: 0.7
        poisson_nsmoothing: 5
        poisson_verbose: false
        poisson_folder: data/
      boundary_conditions:
        BC_type_u:
        - N
        - N
        - D
        - D
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - D
        - D
        - N
        - N
        BC_values_v:
        - 0
        - 0
        - 0
        - 0
      body:
        type: multi_animat
        sdf_folder: /data/andreaferrario/lilytorch/lilytorch/farms_examples/sdfs/salamander_v5/
        plotting: false
        compute_interp: false
        plotting_meshes: false
        save_folder: ../
        n_samples: !!python/tuple
        - 2000
        - 2000
        update_maps:
          rotation: None
          translation:
          - null
          - null
        suit: 0.0
        convexify: false
        scale: 1
      output:
        save_path: /data/andreaferrario/ns_data/
        save_frames: true
        save_every: 100
        vmin: -50
        vmax: 50
        save_uv: false
