# Free rigid sphere (D=0.2) for the two-phase MuJoCo<->BDIM coupling demo.
#
# >>> SINK/FLOAT is controlled by ``DENSITY`` in gen_sphere.py <<<  (NOT here)
# FARMS reads the body mass from the SDF ``<inertial>`` block and ignores
# ``morphology.links.density`` below, so editing it does nothing. gen_sphere.py
# (run by run.sh before launch) writes sphere.sdf's <mass>/<inertia> from its
# DENSITY constant: >1 sinks, <1 floats, ~1 hovers.
sdf: sphere.sdf
spawn:
  loader: 0
  mode: !!python/object/apply:farms_core.model.options.SpawnMode
  - free
  pose:
  - 0.15
  - 0.15
  - 0.5
  - 0
  - 0
  - 0
  velocity:
  - 0
  - 0
  - -0.1
  - 0
  - 0
  - 0
  extras: {}
morphology:
  links:
  - name: base_link
    collisions: trueme
    friction:
    - 0.5
    - 0.5
    - 0
    density: 1.5
  self_collisions: []
  joints: []
control:
  controller_loader: []
  sensors:
    links:
    - base_link
    joints: []
    contacts: []
    xfrc:
    - base_link
    muscles: []
    adhesions: []
    visuals: []
  motors: []
  hill_muscles: []
extensions: []
