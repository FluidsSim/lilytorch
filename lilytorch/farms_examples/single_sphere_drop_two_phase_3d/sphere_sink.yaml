# Free rigid sphere (D=0.2) for the two-phase MuJoCo<->BDIM coupling demo.
# Spawned just below the waterline (SURF=1.8, see simulation_config.yaml) and
# LIGHTER than water (density 0.5): the emergent two-phase buoyancy should push
# it up until it floats HALF-SUBMERGED (centre settling at the waterline z=1.8).
# Change ``density`` to 1.5 to make it sink instead, or ~1.0 to hover.
sdf: sphere_sink.sdf
spawn:
  loader: 0
  mode: !!python/object/apply:farms_core.model.options.SpawnMode
  - free
  pose:
  - 0.5
  - 0.5
  - 1.7
  - 0
  - 0
  - 0
  velocity:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  extras: {}
morphology:
  links:
  - name: base_link
    collisions: true
    friction:
    - 0.5
    - 0.5
    - 0
    density: 1.5
  self_collisions: []
  joints: []
control:
  controller_loader: []
  sensors:
    links:
    - base_link
    joints: []
    contacts: []
    xfrc:
    - base_link
    muscles: []
    adhesions: []
    visuals: []
  motors: []
  hill_muscles: []
extensions: []
