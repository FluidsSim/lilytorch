# Flat-ground arena with a water block. NOTE: with only the FluidExtension
# loaded (see simulation_config.yaml), FARMS' own swimming-drag handler is NOT
# active, so this ``water`` block is COSMETIC/contact only — all hydrodynamic
# loads come from the BDIM two-phase solver. ``height`` is kept equal to the
# fluid free surface SURF=1.8 so the visual waterline matches the simulation.
sdf: ../sdfs/arena_flat_v0/sdf/arena_flat.sdf
spawn:
  loader: 0
  mode: !!python/object/apply:farms_core.model.options.SpawnMode
  - free
  pose:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  velocity:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  extras: {}
water:
  sdf: ../sdfs/arena_water_v0/sdf/arena_water.sdf
  drag: false
  buoyancy: false
  height: 1.8
  velocity:
  - 0
  - 0
  - 0
  viscosity: 1.0
  density: 1.0
  maps:
  - ''
  - ''
ground_height: 0
