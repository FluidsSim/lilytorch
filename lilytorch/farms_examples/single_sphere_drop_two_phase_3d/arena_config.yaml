# OPEN TANK arena (4 translucent walls + floor, open top) enclosing the
# air+water+interface, generated by ``gen_arena.py`` (run it first — run.sh does).
# With only the FluidExtension loaded (see simulation_config.yaml), FARMS' own
# swimming-drag handler is NOT active, so this ``water`` block is COSMETIC/contact
# only — all hydrodynamic loads come from the BDIM two-phase solver, and the live
# air/water interface is drawn by FlowIsoGLViewer (field "interface"). The water
# SDF is a static bulk box filling z in [0, SURF=1.8]; ``height: 0`` because that
# box is already absolutely positioned by gen_arena.py (FARMS water.pos=[0,0,h]).
sdf: ../sdfs/pool/sdf/pool.sdf
spawn:
  loader: 0
  mode: !!python/object/apply:farms_core.model.options.SpawnMode
  - free
  pose:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  velocity:
  - 0
  - 0
  - 0
  - 0
  - 0
  - 0
  extras: {}
water:
  sdf: ../sdfs/arena_water/sdf/arena_water.sdf
  drag: false
  buoyancy: false
  height: 0.0
  velocity:
  - 0
  - 0
  - 0
  viscosity: 1.0
  density: 1.0
  maps:
  - ''
  - ''
ground_height: 0
