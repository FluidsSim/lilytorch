units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 10001
  buffer_size: 10001
  play: true
  rtl: 1.0
  fast: false
  headless: true
  show_progress: true
physics:
  timestep: 0.0001
  gravity:
  - 0
  - 0
  - -9.81
  num_sub_steps: 1
  cb_sub_steps: 1
  n_solver_iters: 50
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicitfast
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 1000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 100.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.farms_examples.single_sphere_drop_gazzola.controller.BDIMhandler
    bdim_yaml:
      solver :
        use_gpu : True
        nthreads : 16


        Nx: 256
        Ny: 2048
        # Nx: 256
        # Ny: 2048
        # Nx: 1024
        # Ny: 8192
        xmin: -0.02
        ymin: 0.0
        xmax: 0.02
        ymax: 0.32

        convection_method : "abdquickest"
        dt                : 0.0001
        nt                : 150000
        nu                : 8.0e-7
        rho               : 996.0
        rho_body          : 1005.96

        # ---- Brinkman penalization (Gazzola et al., 2011) ----
        # use_brinkman: true  -> Brinkman penalization (Eq. 29)
        # use_brinkman: false -> BDIM2 meta-equation
        use_brinkman      : true
        # Penalization parameter lambda (Gazzola default: 1e4).
        # Higher values enforce no-slip more strongly but require
        # smaller dt for stability (dt < 1/lambda).
        brinkman_k        : 10000

        # ---- Force computation method ----
        # "penalization" -> volume integral of IB body force (Gazzola Eq. 37)
        #                   Robust, resolution-insensitive.
        # "stress"       -> surface-stress integration (forces_method2)
        #                   Known to underpredict drag by ~3x for this benchmark.
        force_method      : "penalization"

        poisson_tol            : 1.0e-7
        poisson_max_cycles     : 10
        poisson_max_mgcg_cycles: 5
        jacobi_weight          : 0.7
        poisson_nsmoothing     : 5
        poisson_verbose        : False
        # poisson_method         : "fft"
        # poisson_bc_type        : "neumann"

        poisson_folder         : "data/"


      boundary_conditions:
        BC_type_u:
        - "D"
        - "D"
        - "N"
        - "N"
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - "N"
        - "N"
        - "D"
        - "D"
        BC_values_v:
        - 0
        - 0
        - 0
        - 0

      body:
        type: multi_animat
        plotting: False
        compute_interp: False
        plotting_meshes: False
        save_folder: None
        n_samples:
        - 1000
        - 1000
        update_maps:
          rotation: "None"
          translation:
            - None
            - None
        suit: 0.0
        convexify: True
        scale: 1

      output:
        save_path: "/data/andreaferrario/ns_data/"
        save_frames: True
        save_every : 500
        vmin: -5
        vmax: 5
        save_uv: True

