units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 7001
  buffer_size: 7001
  play: true
  rtl: 1.0
  fast: false
  headless: true
  show_progress: true
physics:
  timestep: 0.0001
  gravity:
  - 0
  - 0
  - -980
  num_sub_steps: 1
  cb_sub_steps: 1
  n_solver_iters: 5000
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicit
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 10000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 100.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.integration.BDIMhandler.BDIMhandler
    bdim_yaml:
      solver:
        use_gpu: True
        nthreads: 16
        dtype: "float64"

        # Nx: 256
        # Ny: 768
        Nx: 512
        Ny: 1536
        # Nx: 1024
        # Ny: 8192
        xmin: 0
        ymin: 0
        xmax: 2
        ymax: 6

        convection_method: "quick"
        dt: 0.000025
        nt: 26001
        nu: 0.01
        rho: 1
        eps_multiplier: 2

        poisson_tol: 1.0e-7
        poisson_max_cycles: 10
        poisson_max_mgcg_cycles: 5
        jacobi_weight: 0.7
        poisson_nsmoothing: 5
        poisson_verbose: True
        poisson_folder: "data/"
        poisson_smoother: "jacobi"
        poisson_method: "fft"
        poisson_bc_type: "neumann"

        heun: false
        force_method: "method2"
        force_delta_order: 1

      boundary_conditions:
        BC_type_u:
        - "D"
        - "D"
        - "D"
        - "D"
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - "D"
        - "D"
        - "D"
        - "D"
        BC_values_v:
        - 0
        - 0
        - 0
        - 0

      physics:
        solref: [0.00001, 10]

      body:
        2d_plane: "xz"       # MuJoCo (x,z) → fluid (x,y); sphere falls in MuJoCo z
        force_scaling: 1.0   # no z-extent scaling for 2-D analytical body
        type: multi_animat
        plotting: False
        compute_interp: False
        plotting_meshes: False
        save_folder: None
        n_samples:
        - 2000
        - 2000
        update_maps:
          rotation: "None"
          translation:
            - None
            - None
        suit: 0.0
        convexify: True
        scale: 1

      output:
        save_path: ""
        existing_folder: /data/andreaferrario/ns_data/coquerelle_sphere_drop
        save_frames: True
        save_every: 1000
        vmin: -50
        vmax: 50
        save_uv: True

- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: /data/andreaferrario/ns_data/coquerelle_sphere_drop/output
    skip: 0
