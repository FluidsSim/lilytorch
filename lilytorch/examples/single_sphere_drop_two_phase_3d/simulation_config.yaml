# =============================================================================
# Two-phase (water + real air) MuJoCo <-> BDIM coupling demo, in SI UNITS
# (metres, kilograms, seconds): THREE SPHERES (D=0.067 m) with different
# densities are dropped from the air into a water tank to demonstrate sinking,
# hovering, and floating under EMERGENT buoyancy of the two-phase fluid.
#
#   LEFT   (x=0.075): HEAVY   sphere — 1500 kg/m³ — RED   — SINKS
#   CENTER (x=0.150): NEUTRAL sphere — 1000 kg/m³ — GREEN — HOVERS
#   RIGHT  (x=0.225): LIGHT   sphere —  500 kg/m³ — BLUE  — FLOATS
#
# Tank / fluid box: 0.3 x 0.3 x 0.6 m.  WATERLINE (single source of truth):
# SURF = 0.4 m. It must agree in two places:
#   * the fluid VOF init below:  alpha_init -> water where Z < 0.4
#   * the arena water (cosmetic): gen_arena.py / arena_config.yaml
# The fluid VOF surface governs the physics; the arena water is visual.
#
# Densities are PHYSICAL (water 1000, air 1.2). The viscosity nu is an
# EFFECTIVE value (~2e-4 m^2/s) chosen to keep Re = U*D/nu ~ O(500) and
# the flow laminar/resolvable at this grid. Body density/mass is set in
# gen_sphere.py (DENSITY per sphere) -> sphere_*.sdf; run.sh regenerates
# the tank + all three sphere SDFs.
# =============================================================================
units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 2000
  buffer_size: 2000
  play: true
  rtl: 1.0
  fast: false
  headless: false
  show_progress: true
physics:
  timestep: 0.0005
  gravity:
  - 0
  - 0
  - -9.81
  num_sub_steps: 1
  cb_sub_steps: 1
  n_solver_iters: 5000
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicit
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 10000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 10.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.integration.BDIMhandler.BDIMhandler
    bdim_yaml:
      solver:
        use_gpu: True
        nthreads: 16
        dtype: "float32"

        # h = 0.3/40 = 0.6/80 = 0.0075 m (uniform). ~9 cells across D=0.067.
        # Raise to 60x60x120 (h=0.005) for a sharper interface (slower).
        Nx: 80
        Ny: 80
        Nz: 160
        xmin: 0
        ymin: 0
        zmin: 0
        xmax: 0.3
        ymax: 0.3
        zmax: 0.6

        convection_method: "abdquickest"
        dt: 0.0001
        nt: 4000
        nu: 2.0e-4               # EFFECTIVE viscosity (m^2/s) -> Re ~ 500 (see header)
        rho: 1000                # water (kg/m^3)
        eps_multiplier: 2

        gravity: [0, 0, -9.81]   # fluid body force -> hydrostatic pressure -> emergent buoyancy
        solver_method: "kernel"  # variable-density projection needs materialised mu0 (no kernel)

        poisson_tol: 1.0e-6
        poisson_max_cycles: 4
        poisson_max_mgcg_cycles: 30
        jacobi_weight: 0.7
        poisson_nsmoothing: 5
        poisson_verbose: False
        poisson_folder: "data/"
        poisson_smoother: "rbgs"
        poisson_method: "multigrid"
        poisson_bc_type: "neumann"

        time_integration: "euler"
        heun: false
        force_method: "lagrangian"
        force_delta_order: 1

        # ---- two-phase (water + real air) free surface, SI densities ----
        two_phase:
          alpha_init: "lambda X, Y, Z: (Z < 0.4).double()"
          rho_water: 1000.0
          rho_air: 1.2
          nu_water: 2.0e-4
          nu_air: 3.0e-3
          face_density: "harmonic"

      boundary_conditions:
        BC_type_u: ["D", "D", "D", "D", "D", "D"]
        BC_values_u: [0, 0, 0, 0, 0, 0]
        BC_type_v: ["D", "D", "D", "D", "D", "D"]
        BC_values_v: [0, 0, 0, 0, 0, 0]
        BC_type_w: ["D", "D", "D", "D", "D", "D"]
        BC_values_w: [0, 0, 0, 0, 0, 0]

      physics:
        solref: [0.00001, 10]

      body:
        force_scaling: 1.0
        type: multi_animat
        plotting: False
        compute_interp: False
        plotting_meshes: False
        save_folder: None
        n_samples:
        - 2000
        - 2000
        update_maps:
          rotation: "None"
          translation:
          - None
          - None
          - None
        suit: 0.0
        convexify: True
        scale: 1

      output:
        save_path: ""
        existing_folder: /tmp/two_phase_sphere_drop
        save_frames: True
        save_every: 200
        vmin: -10
        vmax: 10
        save_uv: False

# Fixed side-on camera recording the tank (the FlowIsoGLViewer interface mesh is
# drawn into this camera's offscreen scene). Loaded BEFORE the GL viewer so its
# renderer exists when the viewer initialises.
- loader: lilytorch.integration.streaming_camera.StreamingCameraRecording
  config:
    path: /tmp/two_phase_sphere_drop/output/video.mp4
    animat_id: null            # fixed camera (not following the body)
    fps: 30
    speed: 0.4
    angular_velocity: 0
    azimuth: 90
    elevation: -12
    distance: 1.3
    offset: [0.15, 0.15, 0.42]  # look at the waterline / floating-ball region
    resolution: [3840, 2160]      # height <= MuJoCo's default 720 offscreen framebuffer

# Live air/water INTERFACE in the MuJoCo viewer: the VOF field alpha at iso 0.5,
# drawn as a translucent blue triangulated surface in MuJoCo's depth buffer (so
# the ball correctly occludes / is occl++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++uded by it).
- loader: lilytorch.integration.flow_iso_gl_viewer.FlowIsoGLViewer
  config:
    field: "interface"         # two-phase VOF alpha (level 0.5 = air/water surface)
    iso_value: 0.5
    alpha: 0.2                # surface opacity
    color_uni: "#3399FF"       # water blue (single, non-signed isosurface)
    smooth_sigma: 0            # smooth the sharp 0/1 VOF step for a cleaner mesh
    exclude_body: False        # the ball is the MuJoCo animat, not part of the iso
    update_every: 1
    max_vertices: 1200000
    crop_boundary: 0           # clip 3 cells from each boundary so the iso surface
                               # does not visibly intersect the domain walls
    debug_force_visible: False

# Replace the default blue-to-black star sky with a solid BLACK sky.
- loader: lilytorch.integration.sky_modifier.SkyModifier
  config:
    rgb: [0.0, 0.0, 0.0]

- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: /tmp/two_phase_sphere_drop/output
    skip: 0
