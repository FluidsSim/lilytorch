units:
  meters: 1
  seconds: 1
  kilograms: 1
runtime:
  n_iterations: 27001
  buffer_size: 27001
  play: true
  rtl: 1.0
  fast: false
  headless: false
  show_progress: true
physics:
  timestep: 0.001
  gravity:
  - 0
  - 0
  - -9.81
  num_sub_steps: 1
  cb_sub_steps: 1
  n_solver_iters: 50
mujoco:
  cone: elliptic
  solver: CG
  integrator: implicitfast
  impratio: 10
  ccd_iterations: 1000
  ccd_tolerance: 1e-6
  noslip_iterations: 1000
  noslip_tolerance: 1e-6
  viewer: MuJoCo
  texture_repeat: 10
  shadow_size: 1024
  visual_scale: 1.0
  extent: 3.0
pybullet:
  opengl2: false
  lcp: dantzig
  cfm: 1.0e-10
  erp: 0
  contact_erp: 0
  friction_erp: 0
  residual_threshold: 1.0e-06
  max_num_cmd_per_1ms: 100000000
  report_solver_analytics: 0
extensions:
- loader: lilytorch.integration.extensions.FluidExtension
  config:
    handler_path: lilytorch.integration.BDIMhandler.BDIMhandler
    bdim_yaml:
      solver :
        use_gpu : True
        nthreads : 16


        Nx: 256
        Ny: 4096
        # Nx: 512
        # Ny: 4096
        # Nx: 1024
        # Ny: 8192
        xmin: -0.02
        ymin: 0.0
        xmax: 0.02
        ymax: 0.64

        convection_method : "quick"
        dt                : 0.001
        nt                : 27001
        nu                : 8.0e-7
        rho               : 996.0
        eps_multiplier    : 2.0

        poisson_tol            : 1.0e-9
        poisson_max_cycles     : 10
        poisson_max_mgcg_cycles: 5
        jacobi_weight          : 0.7
        poisson_nsmoothing     : 5
        poisson_verbose        : True
        poisson_method         : "fft"
        poisson_bc_type        : "neumann"

        poisson_folder         : "output/"

        sponge:
          width   : 0.005    # 1D — absorbing layer on each x-wall only
          strength: 100.0     # 1/s
          axes    : ["x"]    # lateral walls only; do not damp y (settling direction)

        heun: true            # Heun (RK2) for BDIM-projection cycle (matches namkoong)
        force_delta_order: 2

      boundary_conditions:
        BC_type_u:
        - "D"
        - "D"
        - "N"
        - "N"
        BC_values_u:
        - 0
        - 0
        - 0
        - 0
        BC_type_v:
        - "N"
        - "N"
        - "D"
        - "D"
        BC_values_v:
        - 0
        - 0
        - 0
        - 0

      physics:
        solref: [0.001, 0.5]

      body:
        2d_plane: "xz"       # MuJoCo (x,z) → fluid (x,y); sphere falls in MuJoCo z
        force_scaling: 1.0   # no z-extent scaling for 2D analytical body
        type: multi_animat
        plotting: False
        compute_interp: False
        plotting_meshes: False
        save_folder: None
        n_samples:
        - 1000
        - 1000
        update_maps:
          rotation: "None"
          translation:
            - None
            - None
        suit: 0.0
        convexify: True
        scale: 1

      output:
        save_path: ""
        existing_folder: /data/andreaferrario/ns_data/namkoong_sphere_rise
        save_frames: True
        save_every : 500
        vmin: -5
        vmax: 5
        save_uv: True

# - loader: farms_mujoco.simulation.extensions.MjcfSaver
#   config:
#     path: output/simulation_mjcf.xml

# extensions: []

- loader: farms_core.simulation.extensions.ExperimentLogger
  config:
    log_path: /data/andreaferrario/ns_data/namkoong_sphere_rise/output
    skip: 0

