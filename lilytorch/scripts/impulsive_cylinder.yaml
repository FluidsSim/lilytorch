
solver:
  use_gpu           : True
  nthreads          : 16
  N                 : 512
  xmin              : -0.4
  xmax              : 1.6
  ymin              : -1.0
  ymax              : 1.0
  dt                : 0.1
  nt                : 10000
  nu                : 1.0e-5
  rho               : 1.0e+3
  convection_method : "abdquickest"
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 1
  poisson_nsmoothing: 5
  poisson_verbose   : True

boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: analytical
  sdf: "lambda x, y: circle(x,y,xt=0,yt=0,r=0.1)"
  update_maps:
    rotation: "lambda t: 0"
    translation:
      - "lambda t: 0.01*t"
      - "lambda t: 0"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 100
  vmin: -0.1
  vmax: 0.1
  save_uv: True
