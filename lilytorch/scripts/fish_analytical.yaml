
solver:
  use_gpu           : True
  nthreads          : 16
  N                 : 512
  xmin              : -0.5
  xmax              : 5.5
  ymin              : -3.0
  ymax              : 3.

  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3

  dt                : 0.001
  convection_method : "abdquickest"

  # dt                : 0.01
  # convection_method : "implicit"

  poisson_tol       : 1.0e-7
  poisson_max_cycles: 10
  jacobi_weight     : 0.7
  poisson_nsmoothing: 2
  poisson_verbose   : True
  poisson_filename : "data/"

body:
  type: fish_analytical
  update_maps:
    rotation: "None"
    translation:
      - "lambda t: -t"
      - None
  control:
    L: 1
    A: -0.1
    f : 1
    wavefrequency: 1
    c1: 1
    c2: 0
    c3: 0
    sb: 0.1
    wh: 0.1
    wt: 0.1
    st: 0.5
    xshift: 0.0
    yshift: 0.0
    thk: false


boundary_conditions:
  BC_type_u:
  - "D"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0.5
  - 0
  - 0
  - 0
  BC_type_v:
  - "D"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0



output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 100
  vmin: -10
  vmax: 10
  save_uv: False

