
solver :
  use_gpu           : True
  nthreads          : 16

  # dt=0.001
  # dx=0.000101562

  # ## small tank
  # N                 : 256
  # xmin              : -0.02
  # xmax              : 0.006
  # ymin              : -0.013
  # ymax              : 0.013

  ## intermediate tank
  N                 : 1024
  xmin              : -0.02
  xmax              : 0.084
  ymin              : -0.052
  ymax              : 0.052

  # ## big tank
  # N                 : 1024
  # xmin              : -0.02
  # xmax              : 0.508
  # ymin              : -0.264
  # ymax              : 0.264

  dt                : 0.001
  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3
  convection_method : "implicit"
  poisson_tol       : 1.0e-5
  poisson_max_cycles: 1
  poisson_nsmoothing: 10
  poisson_verbose   : False


boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_mesh
  sdf_name: "zebrafish.sdf"
  sdf_folder: "/data/andreaferrario/lilytorch/lilytorch/zebrafish/models/zebrafish_v1_triangulated_scale_x_80/sdf/"
  compute_interp: False
  n_samples: (1024, 1024)
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  suit: 0.000

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 50
  vmin: -60
  vmax: 60
  save_uv: False
