
solver :
  use_gpu           : True
  nthreads          : 16

  # ## big tank
  # N                 : 2048
  # xmin              : -0.02
  # xmax              : 0.16
  # ymin              : -0.09
  # ymax              : 0.09

  ## small tank
  N                 : 1024
  xmin              : -0.02
  xmax              : 0.084
  ymin              : -0.052
  ymax              : 0.052

  dt                : 0.001
  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3
  convection_method : "implicit"
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 1
  poisson_nsmoothing: 5
  poisson_verbose   : False


boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

# body:
#   type: composite_segment_body
#   sdf_name: "zebrafish.sdf"
#   sdf_folder: "/data/andreaferrario/zebrafish/models/zebrafish_v1_triangulated/sdf/"

body:
  type: composite_mesh
  sdf_name: "zebrafish.sdf"
  sdf_folder: "/data/andreaferrario/lilytorch/lilytorch/zebrafish/models/zebrafish_v1_triangulated/sdf/"
  compute_interp: False
  n_samples: (8192, 8192)
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  suit: -0.0001

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 50
  vmin: -5
  vmax: 5
  save_uv: False
