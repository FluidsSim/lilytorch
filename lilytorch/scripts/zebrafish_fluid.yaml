
solver :
  use_gpu           : True
  nthreads          : 16
  # N                 : 1024
  # xmin              : -0.02
  # xmax              : 0.084
  # ymin              : -0.052
  # ymax              : 0.052
  N                 : 256
  xmin              : -0.03
  xmax              : 0.004
  ymin              : -0.017
  ymax              : 0.017
  dt                : 0.001
  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3
  convection_method : "implicit"
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 1
  poisson_nsmoothing: 5
  poisson_verbose   : False


boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_segment_body
  sdf_name: "zebrafish.sdf"
  sdf_folder: "/data/andreaferrario/zebrafish/models/zebrafish_v1_triangulated/sdf/"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 1
  vmin: -10
  vmax: 10
  save_uv: False
