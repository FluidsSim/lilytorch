
solver :
  use_gpu           : True
  nthreads          : 16

  ## tank size
  N                 : 512
  xmin              : -1.0
  xmax              : 2
  ymin              : -1.5
  ymax              : 1.5

  convection_method : "implicit"
  dt                : 0.001

  # convection_method : "abdquickest"
  # dt                : 0.0001

  nt                : 80000
  nu                : 1.0e-6
  rho               : 1.0e+3

  poisson_tol       : 1.0e-4
  poisson_max_cycles: 30
  jacobi_weight     : 0.8
  poisson_nsmoothing: 10
  poisson_verbose   : True
  poisson_filename : "data/"


boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_mesh
  sdf_name: "1guilla.sdf"
  sdf_folder: "/data/andreaferrario/lilytorch/lilytorch/1guillasim/models/1guilla_v1/sdf/"
  plotting: True
  compute_interp: False
  plotting_meshes: False
  n_samples: (1000, 1000)
  update_maps:
    rotation: "None"
    translation:
      - None
      - None
  suit: 0.0
  convexify: True
  scale: 0.001

output:
  save_path: "/data/andreaferrario/ns_data/1guilla/"
  save_frames: True
  save_every : 50
  vmin: -60
  vmax: 60
  save_uv: False
