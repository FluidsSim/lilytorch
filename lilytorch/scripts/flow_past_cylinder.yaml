
solver:
  use_gpu           : False
  nthreads          : 16
  N                 : 256
  xmin              : -0.4
  xmax              : 1.6
  ymin              : -1.0
  ymax              : 1.0
  nt                : 520
  nu                : 1.0e-6
  rho               : 1.0e+3

  poisson_tol       : 1.0e-7
  jacobi_weight     : 0.7
  poisson_max_cycles: 10
  poisson_max_mgcg_cycles: 10
  poisson_nsmoothing: 15
  poisson_verbose   : True
  poisson_folder : "lilytorch/data/"

  # dt                : 1
  # convection_method : "implicit"

  convection_method : "abdquickest"
  dt                : 0.02

# 2*R*U/nu

boundary_conditions:
  BC_type_u:
  - "D"
  - "D"
  - "D"
  - "D"
  BC_values_u:
  - 0.00275
  - 0.00275
  - 0.0
  - 0.0
  BC_type_v:
  - "D"
  - "D"
  - "D"
  - "D"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_analytical
  plotting: False
  sdf:
  - "lambda x, y: circle(x,y,xt=0,yt=0,r=0.1)"
  update_maps:
  - rotation: "lambda t: 0*torch.sin(t/5)"
    translation:
      - "lambda t: 0*torch.sin(t/5)"
      - "lambda t: 0*torch.sin(t/5)"

output:
  save_path: "/data/andreaferrario/ns_data/"
  results_folder: "flow_past_cylinder"
  save_frames: True
  save_every : 250
  vmin: -0.05
  vmax: 0.05
  save_uv: True
