
solver:
  use_gpu           : False
  nthreads          : 16
  N                 : 256
  xmin              : -0.4
  xmax              : 1.6
  ymin              : -1.0
  ymax              : 1.0
  nt                : 30000
  # xmin              : -0.004
  # xmax              : 0.1
  # ymin              : -0.052
  # ymax              : 0.052
  # dt                : 0.0001
  # nt                : 80000
  nu                : 1.0e-4
  rho               : 1.0e+3

  poisson_tol       : 1.0e-5
  jacobi_weight     : 0.8
  poisson_max_cycles: 10
  poisson_nsmoothing: 15
  poisson_verbose   : True
  poisson_filename : "lilytorch/data/"

  dt                : 0.1
  convection_method : "implicit"

  # convection_method : "abdquickest"
  # dt                : 0.0001

# 2*R*U/nu

boundary_conditions:
  BC_type_u:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_u:
  - 0.1
  - 0
  - 0
  - 0
  BC_type_v:
  - "D"
  - "-"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: analytical
  sdf: "lambda x, y: circle(x,y,xt=0,yt=0,r=0.1)"
  update_maps:
    rotation: "lambda t: 0"
    translation:
      - "lambda t: 0"
      - "lambda t: 0"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 50
  vmin: -1
  vmax: 1
  save_uv: False
