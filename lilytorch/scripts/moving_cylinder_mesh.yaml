
solver : 
  use_gpu: True
  nthreads: 16
  N      : 1024
  xmin   : -100
  xmax   : 100
  ymin   : -100
  ymax   : 100
  dt     : 0.01
  nt     : 8000
  nu     : 1.0e-6
  rho    : 1.0e+3

boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u: 
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v: 
  - 0
  - 0
  - 0
  - 0

body:
  type: mesh
  mesh_file: "lilytorch/test_obj/cylinder.obj"
  n_samples: (4096, 4096)
  update_maps: 
    rotation: "lambda t: 30*t"
    translation: 
      - "lambda t: 0*math.cos(t/10)"
      - "lambda t: 0*math.sin(t/10)"

output: 
  save_frames: True
  save_every : 1
  vmin: -0.5
  vmax: 0.5
