
solver :
  use_gpu: True
  nthreads: 16
  N      : 512
  xmin   : -200
  xmax   : 200
  ymin   : -200
  ymax   : 200
  dt     : 0.01
  nt     : 8000
  nu     : 1.0e-6
  rho    : 1.0e+3
  convection_method : "abdquickest"
  poisson_tol       : 1.0e-2
  poisson_max_cycles: 2
  poisson_nsmoothing: 15
  poisson_verbose   : False

boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: analytical
  sdf: "lambda x, y: circle(x,y,xt=0,yt=0,r=10)"
  update_maps:
    rotation: "lambda t: 0*math.sin(t/100)"
    translation:
      - "lambda t: 100*math.cos(t/20)"
      - "lambda t: 0"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 50
  vmin: -0.1
  vmax: 0.1
  save_uv: False