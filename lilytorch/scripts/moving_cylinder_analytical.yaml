
solver :
  use_gpu: False
  nthreads: 16
  N      : 256
  xmin   : 0
  xmax   : 256
  ymin   : 0
  ymax   : 256
  nt     : 8000
  nu     : 1.0e-0
  rho    : 1000.0

  # convection_method : "implicit"
  # dt     : 0.1

  convection_method : "abdquickest"
  dt                : 0.1

  poisson_tol       : 1.0e-5
  jacobi_weight     : 0.8
  poisson_max_mgcg_cycles: 10
  poisson_max_cycles: 10
  poisson_nsmoothing: 50
  poisson_verbose   : True
  poisson_folder : "lilytorch/data/"

boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_analytical
  plotting: True
  sdf:
  - "lambda x, y: circle(x,y,xt=0,yt=0,r=16)"
  update_maps:
    - rotation: "lambda t: 0*torch.cos(t/10)"
      translation:
        - "lambda t: 128+0*torch.cos(t/20)"
        - "lambda t: 128+40*torch.sin(t/20)"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 20
  vmin: -0.1
  vmax: 0.1
  save_uv: False