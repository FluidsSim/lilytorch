
solver :
  use_gpu: True
  nthreads: 16
  N      : 256
  xmin   : -50
  xmax   : 350
  ymin   : -200
  ymax   : 200
  nt     : 8000
  nu     : 1.0e-6
  rho    : 1.0e+3

  convection_method : "implicit"
  dt     : 0.1

  # convection_method : "abdquickest"
  # dt                : 0.01

  poisson_tol       : 1.0e-5
  jacobi_weight     : 0.8
  poisson_max_cycles: 10
  poisson_nsmoothing: 5
  poisson_verbose   : True
  poisson_filename : "lilytorch/data/"

boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0

body:
  type: composite_analytical
  sdf:
  - "lambda x, y: circle(x,y,xt=0,yt=0,r=10)"
  update_maps:
    - rotation: "lambda t: 90*math.cos(t/10)"
      translation:
        - "lambda t: 120+100*math.cos(t/20)"
        - "lambda t: 0"

output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 50
  vmin: -0.1
  vmax: 0.1
  save_uv: False