
solver :
  use_gpu: False
  nthreads: 16
  N      : 256
  xmin   : -1
  xmax   : 1
  ymin   : -1
  ymax   : 1
  nt     : 50000
  nu     : 1.0e-4
  rho    : 1

  # convection_method : "implicit"
  # dt     : 0.1

  convection_method : "abdquickest"
  dt     : 0.01

  poisson_tol       : 1.0e-7
  jacobi_weight     : 0.9
  poisson_max_cycles: 4
  poisson_nsmoothing: 10
  poisson_verbose   : True
  poisson_folder : "lilytorch/data/"




boundary_conditions:
  BC_type_u:
  - "D"
  - "D"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "D"
  - "D"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0


body:
  type: composite_analytical
  sdf:
  - "lambda x, y: box(x,y,xb=0.2,yb=0.03)"
  plotting: False
  update_maps:
    - rotation: "lambda t: 50*t"
      translation:
        - "lambda t: 0*t"
        - "lambda t: 0*t"
    # - rotation: "lambda t: 0*t"
    #   translation:
    #     - "lambda t: -350+10.0*t"
    #     - "lambda t: 0*t"


output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 20
  vmin: -5
  vmax: 5
  save_uv: False

