
solver :
  use_gpu: True
  nthreads: 16
  N      : 512
  xmin   : -400
  xmax   : 400
  ymin   : -400
  ymax   : 400
  nt     : 8000
  nu     : 1.0e-3
  rho    : 1.0e+3

  convection_method : "implicit"
  dt     : 0.1

  # convection_method : "abdquickest"
  # dt     : 0.01

  poisson_tol       : 1.0e-4
  jacobi_weight     : 0.8
  poisson_max_cycles: 10
  poisson_nsmoothing: 5
  poisson_verbose   : True
  poisson_folder : "lilytorch/data/"




boundary_conditions:
  BC_type_u:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_u:
  - 0
  - 0
  - 0
  - 0
  BC_type_v:
  - "N"
  - "N"
  - "N"
  - "N"
  BC_values_v:
  - 0
  - 0
  - 0
  - 0


body:
  type: composite_analytical
  sdf:
  - "lambda x, y: box(x,y,xb=140.0,yb=10.0)"
  update_maps:
    - rotation: "lambda t: 50*torch.sin(t/5)"
      translation:
        - "lambda t: -150+0*t"
        - "lambda t: 0*t"
    # - rotation: "lambda t: 0*t"
    #   translation:
    #     - "lambda t: -350+10.0*t"
    #     - "lambda t: 0*t"


output:
  save_path: "/data/andreaferrario/ns_data/"
  save_frames: True
  save_every : 20
  vmin: -0.5
  vmax: 0.5
  save_uv: False

